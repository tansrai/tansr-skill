name: Skill package CI

# TPB-01: main only, explicitly dispatched after local acceptance and main push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
      - name: Install package manager
        run: npm install --global pnpm@11.3.0 --ignore-scripts
      - name: Install development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:package
      - name: Keep reviewed package evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skill-package-${{ runner.os }}-${{ github.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
